<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050b1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>Centra – Money Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050b1a;--card:#0a1530;--line:#15294f;--blue:#2563eb;--blue2:#1d4ed8;--glow:#3b82f6;--tx:#eaf0ff;--mut:#7d8db0;--in:#34d399;--out:#f87171;
  --phone-w:390px;--phone-h:844px;--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  min-height:calc(var(--vh,1vh)*100);
  background:#0a0e17;
  color:var(--tx);
  font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  display:flex;align-items:center;justify-content:center;
  padding:16px;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--glow);outline-offset:2px}

/* Phone device frame (preview on desktop/tablet) */
.phone-frame{
  position:relative;
  width:min(100%, var(--phone-w));
  height:min(calc(var(--vh,1vh)*100 - 32px),var(--phone-h));
  border-radius:40px;
  padding:12px;
  background:linear-gradient(160deg,#1a2236,#0b101c 55%,#06080f);
  box-shadow:
    0 0 0 1px #2a3348,
    0 0 0 3px #0a0e17,
    0 28px 80px rgba(0,0,0,.55),
    inset 0 1px 0 rgba(255,255,255,.06);
  flex-shrink:0;
}
.phone-frame::before{
  content:"";
  position:absolute;top:18px;left:50%;transform:translateX(-50%);
  width:96px;height:22px;border-radius:999px;background:#05070e;
  box-shadow:inset 0 0 0 1px #1c2436;z-index:20;pointer-events:none;
}
.phone-frame::after{
  content:"";
  position:absolute;right:-3px;top:160px;
  width:3px;height:56px;border-radius:2px 0 0 2px;background:#1c2436;
}
#app{
  position:relative;
  width:100%;height:100%;
  border-radius:28px;
  background:linear-gradient(180deg,#15327a 0%,#0c2052 20%,#071436 48%,#040a1e 75%,#02050f 100%);
  overflow:hidden;display:flex;flex-direction:column;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.04);
}

/* Real phones: full bleed, no decorative bezel */
@media (max-width:600px),(max-height:700px){
  body{padding:0;background:#02050f}
  .phone-frame{
    width:100%;height:calc(var(--vh,1vh)*100);max-height:none;
    border-radius:0;padding:0;box-shadow:none;background:transparent;
  }
  .phone-frame::before,.phone-frame::after{display:none}
  #app{border-radius:0}
  header{padding-top:calc(12px + var(--safe-t))}
}

header{display:flex;align-items:center;justify-content:space-between;padding:calc(28px + var(--safe-t)) 18px 6px}
.logo{font-weight:700;letter-spacing:.5px;display:flex;align-items:center;gap:6px;font-size:calc(17px*var(--fs))}
.logo svg{width:calc(22px*var(--fi));height:calc(22px*var(--fi))}
.ic{width:calc(38px*var(--fi));height:calc(38px*var(--fi));border-radius:12px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line)}
.ic svg{width:calc(18px*var(--fi));height:calc(18px*var(--fi))}
main{flex:1;overflow-y:auto;padding:8px 16px 100px;scrollbar-width:none}
main::-webkit-scrollbar{display:none}
.card{background:linear-gradient(160deg,#0d1f4ad0,#091330c4);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px}
h1{font-size:calc(20px*var(--fs));font-weight:600}
h2{font-size:calc(14px*var(--fs));font-weight:600}
.sub{color:var(--mut);font-size:calc(12px*var(--fs));margin-top:2px}
.row{display:flex;align-items:center;justify-content:space-between}
.ws{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.pill{white-space:nowrap;padding:7px 13px;border-radius:999px;font-size:calc(12px*var(--fs));font-weight:500;background:var(--card);border:1px solid var(--line);color:var(--mut)}
.pill.on{background:var(--blue);border-color:var(--glow);color:#fff;box-shadow:0 0 16px #2563eb66}
.bal{font-size:calc(34px*var(--fs));font-weight:700;margin:6px 0 2px;letter-spacing:-1px}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:calc(11px*var(--fs));color:#60a5fa;background:#2563eb1f;padding:4px 9px;border-radius:999px}
.tag i{width:6px;height:6px;border-radius:50%;background:var(--glow)}
.bar{height:5px;border-radius:9px;background:#13244a;overflow:hidden;margin-top:8px}
.bar b{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--blue2),var(--glow))}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.stat{background:#ffffff08;border-radius:14px;padding:10px 12px}
.stat small{color:var(--mut);font-size:calc(11px*var(--fs));display:block}
.stat b{font-size:calc(17px*var(--fs))}
.in{color:var(--in)}.out{color:var(--out)}
.slide{position:relative;height:54px;border-radius:16px;background:linear-gradient(90deg,#1e40af,var(--blue));margin-bottom:14px;overflow:hidden;touch-action:none;user-select:none}
.slide span{position:absolute;inset:0;display:grid;place-items:center;font-size:calc(13px*var(--fs));font-weight:500;padding-left:40px;pointer-events:none}
.knob{position:absolute;top:5px;left:5px;width:44px;height:44px;border-radius:13px;background:#fff;display:grid;place-items:center;color:var(--blue2);cursor:grab}
.knob svg{width:calc(20px*var(--fi));height:calc(20px*var(--fi))}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.q{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 2px;font-size:calc(10.5px*var(--fs));color:var(--mut);background:#ffffff08;border:1px solid var(--line);border-radius:14px}
.q svg{width:calc(20px*var(--fi));height:calc(20px*var(--fi));color:var(--glow)}
.tx{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid #ffffff0d}
.tx:last-child{border:0}
.tx .ic{width:calc(40px*var(--fi));height:calc(40px*var(--fi));font-size:calc(18px*var(--fi))}
.tx div.m{flex:1;min-width:0}
.tx b{font-size:calc(13px*var(--fs));font-weight:500;display:block}
.tx small{color:var(--mut);font-size:calc(11px*var(--fs))}
.amt{font-weight:600;font-size:calc(13px*var(--fs))}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none}
.acc{position:relative;overflow:hidden}
.acc::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:radial-gradient(#3b82f644,transparent 70%)}
nav{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:space-around;padding:10px 8px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,#050b1a 30%);backdrop-filter:blur(6px)}
nav button.t{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:calc(10.5px*var(--fs));color:var(--mut);width:60px}
nav button.t svg{width:calc(22px*var(--fi));height:calc(22px*var(--fi))}
nav button.t.on{color:var(--glow)}
.fab{width:calc(54px*var(--fi));height:calc(54px*var(--fi));border-radius:50%;background:linear-gradient(145deg,var(--glow),var(--blue2));display:grid;place-items:center;box-shadow:0 0 0 5px #0a1a3d,0 0 28px #2563ebaa;margin-top:-18px}
.fab svg{width:calc(26px*var(--fi));height:calc(26px*var(--fi))}
.sheet{position:absolute;inset:0;background:#02060fcc;display:none;align-items:flex-end;z-index:5}
.sheet.open{display:flex}
.panel{width:100%;max-height:94%;overflow-y:auto;background:linear-gradient(180deg,#0c2052,#040a1e 40%);border:1px solid var(--line);border-radius:28px 28px 0 0;padding:16px}.pop{animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media(prefers-reduced-motion:reduce){.panel{animation:none}}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border-radius:14px;padding:4px;margin:12px 0}
.seg button{padding:9px;border-radius:11px;font-size:calc(13px*var(--fs));color:var(--mut)}
.seg button.on{background:var(--blue);color:#fff}
.big{text-align:center;font-size:calc(42px*var(--fs));font-weight:700;margin:6px 0 10px;letter-spacing:-1px}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.keys button{padding:13px;border-radius:14px;font-size:calc(19px*var(--fs));background:var(--card);border:1px solid var(--line)}
.cta{width:100%;height:52px;border-radius:16px;background:linear-gradient(90deg,#1e40af,var(--blue));font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 8px 24px #2563eb44}
.cta span{width:26px;height:26px;border-radius:50%;background:#fff;color:var(--blue2);display:grid;place-items:center;font-size:calc(14px*var(--fs))}
.toast{position:absolute;left:50%;top:70px;transform:translateX(-50%);background:var(--blue);padding:9px 16px;border-radius:999px;font-size:calc(12px*var(--fs));opacity:0;transition:.3s;z-index:9;pointer-events:none}
.toast.show{opacity:1}
.legend{display:flex;flex-direction:column;gap:9px;font-size:calc(12px*var(--fs));flex:1}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:8px}
.legend .row{color:var(--mut)}.legend .row b{color:var(--tx);font-weight:500}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,a,input,select,summary{touch-action:manipulation}
main{overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.pill{min-height:34px}.keys button{min-height:48px}.ic{flex:none}
@media(max-width:600px),(max-height:700px){
 input,select,textarea,.inp{font-size:16px!important}
 header{padding:calc(10px + var(--safe-t)) max(14px,env(safe-area-inset-right)) 6px max(14px,env(safe-area-inset-left))}
 main{padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right));padding-bottom:calc(96px + var(--safe-b))}
 nav{padding-left:max(6px,env(safe-area-inset-left));padding-right:max(6px,env(safe-area-inset-right))}
 .panel,.sheet.full .panel{max-width:none;width:100%}
 .sheet.full .panel{padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right))}
 .card{padding:14px;border-radius:18px}
}
@media(max-width:360px){.grid4{grid-template-columns:repeat(3,minmax(0,1fr))}.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}.kv{grid-template-columns:1fr}nav button.t{min-width:0;flex:1}.logo{font-size:calc(15px*var(--fh))}.stats{gap:8px}}
@media(max-height:560px){header{padding-top:calc(6px + var(--safe-t))}nav{padding-top:6px}.fab{margin-top:-12px}.keys button{padding:8px;min-height:40px}.big{margin:2px 0}}
.cta,.fab,.toast,.pill.on,.seg button.on,.days button.on,.dayb,.dayb b{color:#fff}.dayb small{color:#dbe7ff}
html[data-theme=light] .cta,html[data-theme=light] .toast,html[data-theme=light] .fab,html[data-theme=light] .pill.on,html[data-theme=light] .seg button.on,html[data-theme=light] .days button.on,html[data-theme=light] .dayb b{color:#fff}
html[data-theme=light] .dayb small{color:#e4edff}html[data-theme=light] .cta span{color:#1d4ed8}
.alo{display:flex;height:12px;border-radius:99px;overflow:hidden;background:#13244a;margin:10px 0}.alo i{display:block;height:100%}
html[data-theme=light] .alo{background:#e3e9f6}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.kv div{background:#ffffff08;border-radius:12px;padding:9px 11px}.kv small{display:block;color:var(--mut);font-size:calc(10.5px*var(--fs))}.kv b{font-size:calc(14px*var(--fs))}
html[data-theme=light] .kv div{background:#f4f7fd}
.dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:7px}
.warn{background:#fbbf2414;border:1px solid #fbbf2455;color:#fbbf24;border-radius:14px;padding:10px 12px;font-size:calc(12px*var(--fs));margin-bottom:10px}
html[data-theme=light] .warn{color:#b45309;background:#f59e0b14}
:root{--fm0:1;--fh0:1;--ft0:1;--fs0:1;--fi0:1;--fh:calc(var(--fm0)*var(--fh0));--ft:calc(var(--fm0)*var(--ft0));--fs:calc(var(--fm0)*var(--fs0));--fi:calc(var(--fm0)*var(--fi0))}
.phone-frame{z-index:1}
.stars.bg{position:fixed;inset:0;z-index:0}
.panel{position:relative}.panel>.stars{position:absolute;inset:0;z-index:0}.panel>*:not(.stars){position:relative;z-index:1}
.shoot{position:absolute;width:90px;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,#cfe0ff 70%,#fff);opacity:0;filter:drop-shadow(0 0 4px #7fb0ff);animation:fly var(--t,1.1s) ease-out forwards;pointer-events:none}
@keyframes fly{0%{opacity:0;transform:translate(0,0) rotate(var(--r))}12%{opacity:.9}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--r))}}
@media(prefers-reduced-motion:reduce){.shoot{display:none}}
.ico{font-size:calc(20px*var(--fi))}.rng{width:100%;accent-color:var(--blue);margin-top:6px}
.q.on2{border-color:var(--glow);box-shadow:0 0 16px #2563eb55;color:var(--tx)}
nav button.t{width:auto;min-width:60px}.q{overflow-wrap:anywhere;text-align:center}
.thumb{width:calc(22px*var(--fi));height:calc(22px*var(--fi));border-radius:6px;object-fit:cover}
/* ===== Light theme (no stars) ===== */
html[data-theme=light]{--bg:#f3f6fc;--card:#ffffff;--line:#e0e7f4;--tx:#0f1a33;--mut:#66779a;--in:#059669;--out:#dc2626;--glow:#2563eb}

html[data-theme=light] body{background:#dde5f4}

html[data-theme=light] details.adv{background:#f8faff}html[data-theme=light] details.adv summary{color:#2563eb}

html[data-theme=light] .dash{border-color:#bcd0f5;color:#2563eb}

html[data-theme=light] .st{background:#2563eb14;color:#2563eb}html[data-theme=light] .st.od{background:#dc262614;color:#dc2626}html[data-theme=light] .st.pa{background:#66779a1a;color:#5a6b8f}html[data-theme=light] .st.ok{background:#05966914;color:#059669}

 else if(d.iclson){const c=ICLS.find(x=>x.id==d.iclson);c.on=!c.on;render()}
 else if(d.iclsadd!==undefined){const v=document.getElementById('icn').value.trim();if(v&&!ICLS.some(c=>c.name==v)){ICLS.push({id:Math.max(...ICLS.map(c=>c.id))+1,name:v,icon:'🧩',color:'#94a3b8',on:true,risk:'Medium',target:0,ret:8,subs:[]});render()}}
 else if(d.iprovadd!==undefined){const v=document.getElementById('ipn').value.trim();if(v&&!IPROV.includes(v)){IPROV.push(v);render()}}
 else if(d.iprovdel){IPROV=IPROV.filter(x=>x!=d.iprovdel);render()}
 else if(d.iriskadd!==undefined){const v=document.getElementById('irn').value.trim();if(v&&!INVS.risks.includes(v)){INVS.risks.push(v);render()}}
 else if(d.iriskdel){INVS.risks=INVS.risks.filter(x=>x!=d.iriskdel);render()}
 else if(d.ixl!==undefined)toast('Tax report export is part of the full build')
 else if(d.theme){APR.theme=d.theme;applyApr();render()}
 else if(d.aprreset!==undefined){APR={...APR,fm:100,fh:100,ft:100,fs:100,fi:100};applyApr();render()}
 else if(d.sub!==undefined){sub=sub==d.sub?'':d.sub;rr()}
 else if(d.tag!==undefined){TG=TG.includes(d.tag)?TG.filter(x=>x!=d.tag):[...TG,d.tag];rr()}
 else if(d.tagadd!==undefined){const v=document.getElementById('tgn').value.trim();if(v){if(!TAGS.includes(v))TAGS.push(v);if(!TG.includes(v))TG.push(v);rr()}}
 else if(d.rpt){AR=d.rpt;rr()}
 else if(d.att){const[c,m]=d.att.split('|');attPick(c,m)}
 else if(d.attlink){addLink(d.attlink)}
 else if(d.attdel){const[c,i]=d.attdel.split('|'),L=attList(c),k=L.findIndex(a=>String(a.id)==i);if(k>=0)L.splice(k,1);attRefresh(c)}
 else if(d.cnew!==undefined)openCat(0);
 else if(d.cedit)openCat(+d.cedit);
 else if(d.cset){const[k,v]=d.cset.split(':');CF[k]=v;csheet()}
 else if(d.csubadd!==undefined){const v=document.getElementById('csn').value.trim();if(v&&!CF.subs.includes(v)){CF.subs.push(v);csheet()}}
 else if(d.csubdel!==undefined){CF.subs.splice(+d.csubdel,1);csheet()}
 else if(d.csave!==undefined)csave();
 else if(d.cdel!==undefined){CATS=CATS.filter(x=>x.id!=CF.id);sheet.classList.remove('open');toast('Category deleted');render()}
 else if(d.tagnew!==undefined){const v=document.getElementById('tg2').value.trim();if(v&&!TAGS.includes(v)){TAGS.push(v);render()}}
 else if(d.tagdel!==undefined){TAGS.splice(+d.tagdel,1);render()}
 else if(d.soon)toast(d.soon+' is part of the full build');
 else if(d.anew!==undefined)openAcc(0);
 else if(d.aedit)openAcc(+d.aedit);
 else if(d.aon){const a=ACCS.find(x=>x.id==d.aon);a.on=!a.on;syncAcc();render()}
 else if(d.aset){const[k,v]=d.aset.split(':');AF[k]=v;asheet()}
 else if(d.ab!==undefined){AF.def=!AF.def;asheet()}
 else if(d.asave!==undefined)asave();
 else if(d.pmadd!==undefined){const v=document.getElementById('pmn').value.trim();if(v&&!PM.includes(v)){PM.push(v);render()}}
 else if(d.pmdel){PM.splice(+d.pmdel,1);render()}
 else if(d.cur){const c=CURS.find(x=>x[0]==d.cur);CUR.code=c[0];CUR.sym=c[1];CUR.loc=c[2];render()}
 else if(d.dec){CUR.dec=Math.max(0,Math.min(2,CUR.dec+ +d.dec));render()}
 else if(d.cfmt){CUR.loc=d.cfmt;render()}
 else if(d.chadd){const v=document.getElementById('ch_'+d.chadd).value.trim();if(v&&!NCH[d.chadd].includes(v)){NCH[d.chadd].push(v);render()}}
 else if(d.chdel){const j=d.chdel.indexOf('|'),c=d.chdel.slice(0,j),v=d.chdel.slice(j+1);NCH[c]=NCH[c].filter(x=>x!=v);render()}
 else if(d.rd){const[k,v]=d.rd.split(':');RDEF[k]=/^\d+$/.test(v)?+v:v;render()}
 else if(d.wsw){ws=d.wsw;toast('Switched to '+ws);render()}
 else if(d.profsave!==undefined)toast('Profile saved')
 else if(d.dt){const j=d.dt.indexOf('|'),c=d.dt.slice(0,j),v=d.dt.slice(j+1),a=R.dest[c];R.dest[c]=a.includes(v)?a.filter(x=>x!=v):[...a,v];rsheet()}
 else if(d.da){const v=document.getElementById('dn_'+d.da).value.trim();if(v){if(!NCH[d.da].includes(v))NCH[d.da].push(v);if(!R.dest[d.da].includes(v))R.dest[d.da].push(v);rsheet()}}
 else if(d.istep){R.incN=Math.max(1,Math.min(99,R.incN+ +d.istep));rsheet()}
 else if(d.bk!==undefined){if(AS==2){AS=1;rr()}else sheet.classList.remove('open','full')}
 else if(d.pick){const j=d.pick.indexOf('|');AX[d.pick.slice(0,j)]=d.pick.slice(j+1);rr()}
 else if(d.confirm!==undefined)saveTx()
 else if(d.rnew!==undefined)openRec(0);
 else if(d.set){const[k,v]=d.set.split(':');R[k]=/^-?\d+$/.test(v)?+v:v;if(k=='freq')R.every=1;if(k=='cat'){R.sub='';const c=CATS.find(x=>x.name==v);if(c){if(c.acct)R.acct=c.acct;if(c.pm)R.pm=c.pm}}rsheet()}
 else if(d.step){R.every=Math.max(1,Math.min(99,R.every+ +d.step));rsheet()}
 else if(d.wd!==undefined){const i=+d.wd;R.wd=R.wd.includes(i)?(R.wd.length>1?R.wd.filter(x=>x!=i):R.wd):[...R.wd,i];rsheet()}
 else if(d.tg){const[k,v]=d.tg.split(':'),x=/^-?\d+$/.test(v)?+v:v;R[k]=R[k].includes(x)?R[k].filter(y=>y!=x):[...R[k],x];rsheet()}
 else if(d.b){R[d.b]=!R[d.b];rsheet()}
 else if(d.flt){FLT=d.flt;render()}
 else if(d.act)act(d.act)
 else if(d.msave!==undefined)msave()
 else if(d.rsave!==undefined)saveRec();
 else if(d.rdel!==undefined){REC=REC.filter(x=>x.id!=R.id);sheet.classList.remove('open');toast('Recurring removed');tab='rec';render()}
 else if(d.tab){tab=d.tab;render()}
 else if(d.ws){ws=d.ws;render()}
 else if(d.go)openSheet(d.t);
 else if(d.close!==undefined)sheet.classList.remove('open');
 else if(d.type){setType(d.type)}
 else if(d.cat){setCat(d.cat);rr()}
 else if(d.k!==undefined){amt=d.k=='C'?'0':d.k=='⌫'?(amt.slice(0,-1)||'0'):(amt=='0'?d.k:(amt+d.k).slice(0,8));rr()}
 else if(d.save!==undefined){if(+amt>0){AS=2;rr()}else toast('Enter an amount first')}
});
applyApr();render();window.__ok=1;
</script>
</body>
</html>
