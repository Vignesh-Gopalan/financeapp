<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050b1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>Centra – Money Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050b1a;--card:#0a1530;--line:#15294f;--blue:#2563eb;--blue2:#1d4ed8;--glow:#3b82f6;--tx:#eaf0ff;--mut:#7d8db0;--in:#34d399;--out:#f87171;
  --phone-w:390px;--phone-h:844px;--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  min-height:100dvh;min-height:100svh;
  background:#0a0e17;
  color:var(--tx);
  font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  display:flex;align-items:center;justify-content:center;
  padding:16px;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--glow);outline-offset:2px}

/* Phone device frame (preview on desktop/tablet) */
.phone-frame{
  position:relative;
  width:min(100%, var(--phone-w));
  height:min(100dvh - 32px, var(--phone-h));
  max-height:100svh;
  border-radius:40px;
  padding:12px;
  background:linear-gradient(160deg,#1a2236,#0b101c 55%,#06080f);
  box-shadow:
    0 0 0 1px #2a3348,
    0 0 0 3px #0a0e17,
    0 28px 80px rgba(0,0,0,.55),
    inset 0 1px 0 rgba(255,255,255,.06);
  flex-shrink:0;
}
.phone-frame::before{
  content:"";
  position:absolute;top:18px;left:50%;transform:translateX(-50%);
  width:96px;height:22px;border-radius:999px;background:#05070e;
  box-shadow:inset 0 0 0 1px #1c2436;z-index:20;pointer-events:none;
}
.phone-frame::after{
  content:"";
  position:absolute;right:-3px;top:160px;
  width:3px;height:56px;border-radius:2px 0 0 2px;background:#1c2436;
}
#app{
  position:relative;
  width:100%;height:100%;
  border-radius:28px;
  background:linear-gradient(180deg,#15327a 0%,#0c2052 20%,#071436 48%,#040a1e 75%,#02050f 100%);
  overflow:hidden;display:flex;flex-direction:column;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.04);
}

/* Real phones: full bleed, no decorative bezel */
@media (max-width:480px){
  body{padding:0;background:#02050f}
  .phone-frame{
    width:100%;height:100dvh;height:100svh;max-height:none;
    border-radius:0;padding:0;box-shadow:none;background:transparent;
  }
  .phone-frame::before,.phone-frame::after{display:none}
  #app{border-radius:0}
  header{padding-top:calc(12px + var(--safe-t))}
}

header{display:flex;align-items:center;justify-content:space-between;padding:calc(28px + var(--safe-t)) 18px 6px}
.logo{font-weight:700;letter-spacing:.5px;display:flex;align-items:center;gap:6px;font-size:17px}
.logo svg{width:22px;height:22px}
.ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line)}
.ic svg{width:18px;height:18px}
main{flex:1;overflow-y:auto;padding:8px 16px 100px;scrollbar-width:none}
main::-webkit-scrollbar{display:none}
.card{background:linear-gradient(160deg,#0d1f4ad0,#091330c4);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px}
h1{font-size:20px;font-weight:600}
h2{font-size:14px;font-weight:600}
.sub{color:var(--mut);font-size:12px;margin-top:2px}
.row{display:flex;align-items:center;justify-content:space-between}
.ws{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.pill{white-space:nowrap;padding:7px 13px;border-radius:999px;font-size:12px;font-weight:500;background:var(--card);border:1px solid var(--line);color:var(--mut)}
.pill.on{background:var(--blue);border-color:var(--glow);color:#fff;box-shadow:0 0 16px #2563eb66}
.bal{font-size:34px;font-weight:700;margin:6px 0 2px;letter-spacing:-1px}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:#60a5fa;background:#2563eb1f;padding:4px 9px;border-radius:999px}
.tag i{width:6px;height:6px;border-radius:50%;background:var(--glow)}
.bar{height:5px;border-radius:9px;background:#13244a;overflow:hidden;margin-top:8px}
.bar b{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--blue2),var(--glow))}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.stat{background:#ffffff08;border-radius:14px;padding:10px 12px}
.stat small{color:var(--mut);font-size:11px;display:block}
.stat b{font-size:17px}
.in{color:var(--in)}.out{color:var(--out)}
.slide{position:relative;height:54px;border-radius:16px;background:linear-gradient(90deg,#1e40af,var(--blue));margin-bottom:14px;overflow:hidden;touch-action:none;user-select:none}
.slide span{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;font-weight:500;padding-left:40px;pointer-events:none}
.knob{position:absolute;top:5px;left:5px;width:44px;height:44px;border-radius:13px;background:#fff;display:grid;place-items:center;color:var(--blue2);cursor:grab}
.knob svg{width:20px;height:20px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.q{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 2px;font-size:10.5px;color:var(--mut);background:#ffffff08;border:1px solid var(--line);border-radius:14px}
.q svg{width:20px;height:20px;color:var(--glow)}
.tx{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid #ffffff0d}
.tx:last-child{border:0}
.tx .ic{width:40px;height:40px;font-size:18px}
.tx div.m{flex:1;min-width:0}
.tx b{font-size:13px;font-weight:500;display:block}
.tx small{color:var(--mut);font-size:11px}
.amt{font-weight:600;font-size:13px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none}
.acc{position:relative;overflow:hidden}
.acc::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:radial-gradient(#3b82f644,transparent 70%)}
nav{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:space-around;padding:10px 8px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,#050b1a 30%);backdrop-filter:blur(6px)}
nav button.t{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;color:var(--mut);width:60px}
nav button.t svg{width:22px;height:22px}
nav button.t.on{color:var(--glow)}
.fab{width:54px;height:54px;border-radius:50%;background:linear-gradient(145deg,var(--glow),var(--blue2));display:grid;place-items:center;box-shadow:0 0 0 5px #0a1a3d,0 0 28px #2563ebaa;margin-top:-18px}
.fab svg{width:26px;height:26px}
.sheet{position:absolute;inset:0;background:#02060fcc;display:none;align-items:flex-end;z-index:5}
.sheet.open{display:flex}
.panel{width:100%;max-height:94%;overflow-y:auto;background:linear-gradient(180deg,#0c2052,#040a1e 40%);border:1px solid var(--line);border-radius:28px 28px 0 0;padding:16px}.pop{animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media(prefers-reduced-motion:reduce){.panel{animation:none}}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border-radius:14px;padding:4px;margin:12px 0}
.seg button{padding:9px;border-radius:11px;font-size:13px;color:var(--mut)}
.seg button.on{background:var(--blue);color:#fff}
.big{text-align:center;font-size:42px;font-weight:700;margin:6px 0 10px;letter-spacing:-1px}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.keys button{padding:13px;border-radius:14px;font-size:19px;background:var(--card);border:1px solid var(--line)}
.cta{width:100%;height:52px;border-radius:16px;background:linear-gradient(90deg,#1e40af,var(--blue));font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 8px 24px #2563eb44}
.cta span{width:26px;height:26px;border-radius:50%;background:#fff;color:var(--blue2);display:grid;place-items:center;font-size:14px}
.toast{position:absolute;left:50%;top:70px;transform:translateX(-50%);background:var(--blue);padding:9px 16px;border-radius:999px;font-size:12px;opacity:0;transition:.3s;z-index:9;pointer-events:none}
.toast.show{opacity:1}
.legend{display:flex;flex-direction:column;gap:9px;font-size:12px;flex:1}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:8px}
.legend .row{color:var(--mut)}.legend .row b{color:var(--tx);font-weight:500}
.panel{width:100%;margin:0 auto}

.sheet.full{background:linear-gradient(180deg,#15327a,#071436 38%,#02050f);align-items:stretch;z-index:6}
.sheet.full .panel{height:100%;max-height:none;border:0;border-radius:0;background:transparent;display:flex;flex-direction:column;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.grow{flex:1;overflow-y:auto;min-height:0}
.arow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 12px;margin-bottom:8px;border-radius:16px;background:#0c1a3acc;border:1px solid var(--line)}
.arow.on{border-color:var(--glow);box-shadow:0 0 16px #2563eb55}.arow .m{flex:1}.arow b{font-size:13px;font-weight:500;display:block}.arow small{color:var(--mut);font-size:11px}
.arow i{width:18px;height:18px;border-radius:50%;border:2px solid #3a4f80;flex:none}.arow.on i{background:var(--blue);border-color:#fff;box-shadow:inset 0 0 0 3px #071436}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.grid3 .q{padding:12px 4px;text-align:center}
.st{font-size:10px;padding:3px 8px;border-radius:99px;background:#2563eb26;color:#60a5fa;text-transform:capitalize;white-space:nowrap}.st.od{background:#f8717126;color:#f87171}.st.pa{background:#7d8db026;color:#a9b8d8}.st.ok{background:#34d39926;color:#34d399}
.dayb.od{background:linear-gradient(160deg,#b91c1c,#4a1414)}
details.adv{margin-top:16px;border:1px solid var(--line);border-radius:16px;padding:12px 14px;background:#ffffff06}details.adv summary{font-size:13px;font-weight:600;cursor:pointer;color:#9fc0ff}
.inp{color-scheme:dark}.stats4{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.pill,.seg button{display:inline-flex;align-items:center;justify-content:center;gap:6px}.pill svg,.seg button svg,.sub svg{width:15px;height:15px;flex:none}
.rrow .m small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stepper{display:flex;align-items:center;gap:12px}.stepper button{width:36px;height:36px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:18px}.stepper b{min-width:22px;text-align:center;font-size:17px}.stepper span{color:var(--mut);font-size:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
header,main{position:relative;z-index:1}nav{z-index:2;background:linear-gradient(transparent,#02050f 35%)}
.stars{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.stars i{position:absolute;border-radius:50%;background:#d6e4ff;box-shadow:0 0 4px 1px #6ea0ff88;opacity:0;animation:tw var(--d,4s) ease-in-out infinite}
@keyframes tw{0%,100%{opacity:0;transform:scale(.5)}50%{opacity:var(--o,.7);transform:scale(1)}}
@media(prefers-reduced-motion:reduce){.stars i{animation:none;opacity:.35}}
.rrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #ffffff0d;cursor:pointer}
.rrow:last-child{border:0}.rrow.off{opacity:.45}
.rrow .m{flex:1;min-width:0}.rrow .m b{font-size:13px;font-weight:500;display:block}.rrow .m small{color:var(--mut);font-size:11px}
.dayb{width:44px;height:48px;border-radius:13px;background:linear-gradient(160deg,#1d4ed8,#14306f);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;flex:none}
.dayb b{font-size:17px}.dayb small{font-size:9.5px;color:#bcd0ff;margin-top:3px}
.soon{color:#60a5fa!important}
.sw{width:40px;height:24px;border-radius:99px;background:#1a2a52;position:relative;transition:.2s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#7d8db0;transition:.2s}
.sw.on{background:var(--blue)}.sw.on::after{left:19px;background:#fff}
.fld{font-size:12px;color:var(--mut);display:block;margin:14px 0 7px}
.inp{width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;color:var(--tx);font:inherit;font-size:15px;appearance:none}
.inp:focus{outline:2px solid var(--glow)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.days button{aspect-ratio:1;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:12.5px;color:var(--mut)}
.days button.on{background:var(--blue);color:#fff;border-color:var(--glow);box-shadow:0 0 14px #2563eb77}
.sumbox{margin:16px 0;padding:13px 14px;border-radius:16px;background:#2563eb14;border:1px solid #2563eb55;font-size:12.5px;line-height:1.55;color:#c9d8ff}
.swrow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px;font-size:13px}
.swrow small{color:var(--mut);font-size:11px;display:block;margin-top:2px}
.dash{width:100%;padding:13px;border:1px dashed #2a4a8f;border-radius:14px;color:#60a5fa;font-size:13px;margin-top:8px}
.del{width:100%;text-align:center;margin-top:10px;color:var(--out);font-size:13px;padding:8px}


:root{--zs:1;--zh:1;--zi:1}
#app>header,#app>main,#app>nav,.panel{zoom:var(--zs)}
.logo,h1,h2{zoom:var(--zh)}
.ic,.q svg,nav button svg,.logo svg{zoom:var(--zi)}
.stars{z-index:7}
.sh{position:absolute;width:90px;height:1.5px;border-radius:2px;background:linear-gradient(90deg,transparent,#fff);opacity:0;transform:rotate(28deg);filter:drop-shadow(0 0 3px #8db4ff);animation:fly var(--t,1.3s) ease-out forwards}
@keyframes fly{0%{opacity:0;translate:0 0}12%{opacity:.9}100%{opacity:0;translate:var(--dx,260px) var(--dy,140px)}}
.strip{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}.strip::-webkit-scrollbar{display:none}
.chip2{flex:none;display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:12px;color:var(--mut)}
.chip2.on{border-color:var(--glow);box-shadow:0 0 14px #2563eb44}.chip2 b{font-weight:500;color:var(--tx);display:block}.chip2 small{display:block;font-size:10px}
.lbl{font-size:11px;color:var(--mut);margin:8px 0 4px;display:flex;justify-content:space-between}
.sheet.full .keys button{padding:10px}.sheet.full .big{margin:2px 0 6px}
.attg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.attg button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 2px;font-size:11px;border-radius:14px;background:var(--card);border:1px solid var(--line);color:var(--mut)}.attg svg{width:20px;height:20px;color:var(--glow)}
.attl{display:flex;align-items:center;gap:10px;padding:8px 10px;margin-top:8px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:12px}.attl img{width:34px;height:34px;object-fit:cover;border-radius:8px}.attl>span:nth-child(2){flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rng{width:100%;accent-color:var(--glow);margin-top:6px}
body.light{--bg:#f7f4ee;--card:#fff;--line:#e6dfd0;--blue:#1e3a8a;--blue2:#172b6b;--glow:#3b5bdb;--tx:#1b2438;--mut:#7a8296;--in:#0f9d6b;--out:#d1435b;background:#e9e4d9}
.light .phone-frame{background:linear-gradient(160deg,#fff,#e5dfd1);box-shadow:0 0 0 1px #d8d0bd,0 28px 80px rgba(60,50,20,.25)}
.light #app{background:linear-gradient(180deg,#fbf9f4,#f6f2ea 55%,#efe9dc);box-shadow:inset 0 0 0 1px #e6dfd0}
.light .card{background:linear-gradient(160deg,#fff,#fdfbf6);box-shadow:0 6px 22px rgba(60,50,20,.07)}
.light .stat,.light .q{background:#f7f3ea}
.light .panel{background:linear-gradient(180deg,#fff,#faf7f0)}
.light .sheet{background:#1b243866}.light .sheet.full{background:linear-gradient(180deg,#fbf9f4,#f2ede1)}.light .sheet.full .panel{background:transparent}
.light nav{background:linear-gradient(transparent,#f7f4ee 35%)}
.light .pill.on{color:#fff;box-shadow:0 4px 14px #1e3a8a33}
.light .arow,.light .keys button,.light .days button{background:#fff}.light .arow i{border-color:#c9c0aa}.light .arow.on i{box-shadow:inset 0 0 0 3px #fff}.light .arow.on{box-shadow:0 4px 14px #1e3a8a22}
.light .sw{background:#ddd5c3}.light .fab{box-shadow:0 0 0 5px #f7f4ee,0 8px 22px #1e3a8a55}
.light .bar{background:#ece6d8}.light .sumbox{background:#1e3a8a0d;border-color:#1e3a8a33;color:#2a3a6b}
.light .tx,.light .rrow{border-color:#0000000d}.light .inp{color-scheme:light}
.light details.adv{background:#fbf9f4}.light details.adv summary{color:var(--blue)}
.light .dayb{background:linear-gradient(160deg,#1e3a8a,#3b5bdb)}.light .dayb.od{background:linear-gradient(160deg,#b91c1c,#e11d48)}
.light .tag{color:#1e3a8a;background:#1e3a8a14}.light .tag i{background:#1e3a8a}.light .soon{color:#1e3a8a!important}.light .st{color:#1e3a8a;background:#1e3a8a14}.light .st.od{color:#d1435b;background:#d1435b1a}.light .st.ok{color:#0f9d6b;background:#0f9d6b1a}
.light .dash{border-color:#b9c3e6;color:var(--blue)}.light .logo svg{fill:#1e3a8a}.light svg text{fill:#1b2438}.light .stars,.light .sh{display:none}
</style>
</head>
<body>
<div class="phone-frame">
<div id="app">
  <header>
    <button class="ic" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
    <div class="logo"><svg viewBox="0 0 24 24" fill="#3b82f6"><path d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg>CENTRA</div>
    <button class="ic" aria-label="Notifications"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 9a6 6 0 0 1 12 0c0 6 2 7 2 7H4s2-1 2-7zM10 20h4"/></svg></button>
  </header>
  <main id="main"><div class="card"><h2>Loading Centra…</h2><div class="sub">If this message stays, your viewer is blocking JavaScript. Open this file in Chrome or Safari.</div></div><noscript><div class="card"><h2>JavaScript is off</h2><div class="sub">Centra needs JavaScript. Turn it on or open the file in Chrome or Safari.</div></div></noscript></main>
  <nav id="nav"></nav>
  <div class="sheet" id="sheet"></div>
  <div class="toast" id="toast"></div>
</div>
</div>
<script>
window.addEventListener("error",function(e){var m=document.getElementById("main");if(m&&!window.__ok)m.innerHTML='<div class="card"><h2>Something failed to load</h2><div class="sub">'+e.message+" (line "+e.lineno+")</div></div>"});
</script>
<script>
const I={
home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
wallet:'<path d="M3 7a2 2 0 0 1 2-2h13v4"/><path d="M3 7v11a2 2 0 0 0 2 2h15V9H5a2 2 0 0 1-2-2z"/><circle cx="16" cy="14.5" r="1"/>',
bolt:'<path d="M13 2 4 14h6l-1 8 9-12h-6z" fill="currentColor"/>',
swap:'<path d="M7 4 3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7"/>',

/* ---------- Twinkling + flying stars ---------- */
(function(){const L=document.createElement('div');L.className='stars';document.getElementById('app').appendChild(L);
 const place=s=>{s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%'};
 for(let i=0;i<69;i++){const s=document.createElement('i'),z=Math.random(),sz=z<.75?1:z<.95?1.6:2.2;
  s.style.width=s.style.height=sz+'px';s.style.setProperty('--d',(2.5+Math.random()*5)+'s');s.style.setProperty('--o',.3+Math.random()*.4);
  s.style.animationDelay=(-Math.random()*6)+'s';place(s);
  s.addEventListener('animationiteration',()=>{if(Math.random()<.6)place(s)});L.appendChild(s)}
 const fly=()=>{if(!document.body.classList.contains('light')&&!document.hidden&&!matchMedia('(prefers-reduced-motion:reduce)').matches){const s=document.createElement('b'),dx=180+Math.random()*160;s.className='sh';s.style.cssText=`left:${Math.random()*60}%;top:${Math.random()*45}%;--dx:${dx}px;--dy:${dx*.53}px;--t:${(1+Math.random()*.8).toFixed(2)}s`;L.appendChild(s);s.addEventListener('animationend',()=>s.remove())}setTimeout(fly,3500+Math.random()*6500)};setTimeout(fly,2500)})();

function initSlide(s){const k=s.querySelector('.knob');let drag=false,x0=0;const max=()=>s.clientWidth-54;
 k.onpointerdown=e=>{drag=true;x0=e.clientX;k.setPointerCapture(e.pointerId)};
 k.onpointermove=e=>{if(!drag)return;k.style.left=Math.max(5,Math.min(max(),5+e.clientX-x0))+'px'};
 k.onpointerup=()=>{if(!drag)return;drag=false;if(parseInt(k.style.left)>max()-20){toast('Card bill of ₹28,400 paid from HDFC Savings');k.style.left='5px'}else{k.style.transition='.2s';k.style.left='5px';setTimeout(()=>k.style.transition='',220)}}}

<div class="keys">${[1,2,3,4,5,6,7,8,9,'C',0,'⌫'].map(k=>`<button data-k="${k}">${k}</button>`).join('')}</div>
<div class="row" style="gap:10px"><button class="ic" style="width:52px;height:52px;flex:none;font-size:20px" data-save aria-label="Add details, tags and attachments">📎</button><button class="cta" data-confirm>Save ${type.toLowerCase()} <span>✓</span></button></div></div>`;
return `<div class="panel">${hd('Add details')}<div class="sub" style="margin-bottom:4px">${inr(+amt)} · ${xf?'Transfer':type=='Income'?'Income':cat}${TS.sub?' › '+TS.sub:''} · ${AX.acct}${xf?' → '+AX.to:' · '+AX.pm}</div><div class="grow">
${xf?'':subUI(cat,TS.sub,'tx')}${tagUI(TS.tags,'tx')}<label class="fld">Attachments</label>${attUI(TS.att,'tx')}
<div class="swrow"><div>Make this recurring<small>Saved as a rule with this account and payment method.</small></div><button class="sw ${TS.rep?'on':''}" data-trep role="switch" aria-checked="${TS.rep}" aria-label="Make recurring"></button></div>
${TS.rep?`<div class="chips" style="margin-top:10px">${[['week','Weekly'],['month','Monthly'],['year','Yearly']].map(x=>`<button class="pill ${TS.rf==x[0]?'on':''}" data-trf="${x[0]}">${x[1]}</button>`).join('')}</div>`:''}</div>
<button class="cta" style="margin-top:12px" data-confirm>Confirm ${type.toLowerCase()} <span>✓</span></button></div>`}
function openSheet(t){type=t||'Expense';amt='0';AS=1;TS={sub:'',tags:[],att:[],rep:false,rf:'month'};AX.acct=dacc()||AX.acct;if(AX.to==AX.acct)AX.to=(ACCS.find(a=>a.on&&a.name!=AX.acct)||{}).name||AX.to;applyCat(cat);sheet.innerHTML=sheetHTML();sheet.querySelector('.panel').classList.add('pop');sheet.classList.add('open','full')}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)}

document.getElementById('app').addEventListener('click',e=>{
 const tg=e.target.closest('[data-rt]');
 if(tg){const r=REC.find(x=>x.id==tg.dataset.rt);r.on=!r.on;render();return}
 const ed=e.target.closest('[data-re]');
 if(ed&&!e.target.closest('button')){DET=+ed.dataset.re;tab='rd';render();return}
 const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 if(d.mt)mt(d.mt);
 else if(d.att){const[k,m]=d.att.split('|');if(m=='link'){const e=document.getElementById('al_'+k);e&&e.focus()}else pickFile(k,m)}
 else if(d.attlink){const k=d.attlink,v=document.getElementById('al_'+k).value.trim();if(!/^https?:\/\//i.test(v)){toast('Enter a valid https link');return}attList(k).push({kind:'Link',name:v.replace(/^https?:\/\//,'').slice(0,40),t:'link',url:v});refreshAtt(k)}
 else if(d.attdel){const[k,i]=d.attdel.split('|');attList(k).splice(+i,1);refreshAtt(k)}
 else if(d.tag){const[k,t]=d.tag.split('|'),a=k=='tx'?TS.tags:R.tags,j=a.indexOf(t);j<0?a.push(t):a.splice(j,1);k=='tx'?rs():rsheet()}
 else if(d.sub){const[k,v]=d.sub.split('|');if(k=='tx'){TS.sub=TS.sub==v?'':v;rs()}else{R.sub=R.sub==v?'':v;rsheet()}}
 else if(d.trep!==undefined){TS.rep=!TS.rep;rs()}
 else if(d.trf){TS.rf=d.trf;rs()}
 else if(d.theme)setTheme(d.theme)
 else if(d.fspre){['zs','zh','zi'].forEach(k=>setFs(k,+d.fspre));render()}
 else if(d.cnew!==undefined){CF={i:-1,n:'',e:'🏷️',sub:[],acct:'',pm:''};csheet(true)}
 else if(d.cedit){const c=CATS[+d.cedit];CF={i:+d.cedit,n:c.n,e:c.e,sub:[...c.sub],acct:c.acct,pm:c.pm};csheet(true)}
 else if(d.csa!==undefined){const v=document.getElementById('csn').value.trim();if(v&&!CF.sub.includes(v))CF.sub.push(v);csheet()}
 else if(d.csd){CF.sub.splice(+d.csd,1);csheet()}
 else if(d.csave!==undefined){if(!CF.n.trim()){toast('Name the category');return}const o={n:CF.n.trim(),e:CF.e||'🏷️',sub:CF.sub,acct:CF.acct,pm:CF.pm};CF.i<0?CATS.push(o):CATS[CF.i]=o;sheet.classList.remove('open');toast('Category saved');render()}
 else if(d.cdel!==undefined){CATS.splice(CF.i,1);sheet.classList.remove('open');render()}
 else if(d.tgadd!==undefined){const v=document.getElementById('tgn').value.trim();if(v&&!TAGS.includes(v)){TAGS.push(v);render()}}
 else if(d.tgdel){TAGS.splice(+d.tgdel,1);render()}
 else if(d.soon)toast(d.soon+' is part of the full build');
 else if(d.anew!==undefined)openAcc(0);
 else if(d.aedit)openAcc(+d.aedit);
 else if(d.aon){const a=ACCS.find(x=>x.id==d.aon);a.on=!a.on;syncAcc();render()}
 else if(d.aset){const[k,v]=d.aset.split(':');AF[k]=v;asheet()}
 else if(d.ab!==undefined){AF.def=!AF.def;asheet()}
 else if(d.asave!==undefined)asave();
 else if(d.pmadd!==undefined){const v=document.getElementById('pmn').value.trim();if(v&&!PM.includes(v)){PM.push(v);render()}}
 else if(d.pmdel){PM.splice(+d.pmdel,1);render()}
 else if(d.cur){const c=CURS.find(x=>x[0]==d.cur);CUR.code=c[0];CUR.sym=c[1];CUR.loc=c[2];render()}
 else if(d.dec){CUR.dec=Math.max(0,Math.min(2,CUR.dec+ +d.dec));render()}
 else if(d.cfmt){CUR.loc=d.cfmt;render()}
 else if(d.chadd){const v=document.getElementById('ch_'+d.chadd).value.trim();if(v&&!NCH[d.chadd].includes(v)){NCH[d.chadd].push(v);render()}}
 else if(d.chdel){const j=d.chdel.indexOf('|'),c=d.chdel.slice(0,j),v=d.chdel.slice(j+1);NCH[c]=NCH[c].filter(x=>x!=v);render()}
 else if(d.rd){const[k,v]=d.rd.split(':');RDEF[k]=/^\d+$/.test(v)?+v:v;render()}
 else if(d.wsw){ws=d.wsw;toast('Switched to '+ws);render()}
 else if(d.profsave!==undefined)toast('Profile saved')
 else if(d.dt){const j=d.dt.indexOf('|'),c=d.dt.slice(0,j),v=d.dt.slice(j+1),a=R.dest[c];R.dest[c]=a.includes(v)?a.filter(x=>x!=v):[...a,v];rsheet()}
 else if(d.da){const v=document.getElementById('dn_'+d.da).value.trim();if(v){if(!NCH[d.da].includes(v))NCH[d.da].push(v);if(!R.dest[d.da].includes(v))R.dest[d.da].push(v);rsheet()}}
 else if(d.istep){R.incN=Math.max(1,Math.min(99,R.incN+ +d.istep));rsheet()}
 else if(d.bk!==undefined){if(AS==2){AS=1;sheet.innerHTML=sheetHTML()}else sheet.classList.remove('open','full')}
 else if(d.pick){const j=d.pick.indexOf('|');AX[d.pick.slice(0,j)]=d.pick.slice(j+1);sheet.innerHTML=sheetHTML()}
 else if(d.confirm!==undefined){if(!(+amt>0)){toast('Enter an amount first');return}if(type=='Transfer'&&AX.acct==AX.to){toast('Pick two different accounts');return}
  const a=ACCS.find(x=>x.name==AX.acct),b=ACCS.find(x=>x.name==AX.to),n=+amt;
  if(type=='Expense')a.bal-=n;else if(type=='Income')a.bal+=n;else{a.bal-=n;b.bal+=n}
  const ex=(TS.sub&&type!='Transfer'?'':'')+(TS.tags.length?' · '+TS.tags.map(t=>'#'+t).join(' '):'')+(TS.att.length?' · 📎'+TS.att.length:'');
  TX.unshift([type=='Income'?'💰':type=='Transfer'?'🔁':'🧾',type=='Expense'?cat+(TS.sub?' › '+TS.sub:''):type,(type=='Transfer'?AX.acct+' → '+AX.to:type+' · '+AX.acct+' · '+AX.pm)+ex,type=='Expense'?-n:n,'Just now',type=='Transfer'?'x':0]);
  if(TS.rep){const td=today(),k=iso(td);REC.push(mk({id:Math.max(0,...REC.map(x=>x.id))+1,type:type=='Income'?'col':type=='Transfer'?'xfer':'pay',name:type=='Expense'?cat:type=='Income'?(TS.sub||'Income'):'Transfer',amt:n,cat:type=='Transfer'?'Other':cat,sub:TS.sub,tags:[...TS.tags],att:[...TS.att],acct:AX.acct,to:AX.to,pm:AX.pm,freq:TS.rf,dom:td.getDate(),mon:td.getMonth(),wd:[td.getDay()],start:k,hist:[{key:k,date:k,paid:n,status:'paid',acct:AX.acct,pm:AX.pm}]}))}
  sheet.classList.remove('open','full');toast(type+' saved to '+AX.acct+(TS.rep?' · recurring added':''));render()}
 else if(d.rnew!==undefined)openRec(0);
 else if(d.set){const[k,v]=d.set.split(':');R[k]=/^-?\d+$/.test(v)?+v:v;if(k=='freq')R.every=1;if(k=='cat'){R.sub='';const c=cobj(v);if(c.acct&&ACC.includes(c.acct))R.acct=c.acct;if(c.pm)R.pm=c.pm}rsheet()}
 else if(d.step){R.every=Math.max(1,Math.min(99,R.every+ +d.step));rsheet()}
 else if(d.wd!==undefined){const i=+d.wd;R.wd=R.wd.includes(i)?(R.wd.length>1?R.wd.filter(x=>x!=i):R.wd):[...R.wd,i];rsheet()}
 else if(d.tg){const[k,v]=d.tg.split(':'),x=/^-?\d+$/.test(v)?+v:v;R[k]=R[k].includes(x)?R[k].filter(y=>y!=x):[...R[k],x];rsheet()}
 else if(d.b){R[d.b]=!R[d.b];rsheet()}
 else if(d.flt){FLT=d.flt;render()}
 else if(d.act)act(d.act)
 else if(d.msave!==undefined)msave()
 else if(d.rsave!==undefined)saveRec();
 else if(d.rdel!==undefined){REC=REC.filter(x=>x.id!=R.id);sheet.classList.remove('open');toast('Recurring removed');tab='rec';render()}
 else if(d.tab){tab=d.tab;render()}
 else if(d.ws){ws=d.ws;render()}
 else if(d.go)openSheet(d.t);
 else if(d.close!==undefined)sheet.classList.remove('open');
 else if(d.type){type=d.type;sheet.innerHTML=sheetHTML()}
 else if(d.cat){cat=d.cat;applyCat(cat);rs()}
 else if(d.k!==undefined){amt=d.k=='C'?'0':d.k=='⌫'?(amt.slice(0,-1)||'0'):(amt=='0'?d.k:(amt+d.k).slice(0,8));sheet.innerHTML=sheetHTML()}
 else if(d.save!==undefined){if(+amt>0){AS=2;sheet.innerHTML=sheetHTML()}else toast('Enter an amount first')}
});
try{Object.assign(FS,JSON.parse(localStorage.getItem('centra')||'{}'))}catch(e){}
['zs','zh','zi'].forEach(k=>document.documentElement.style.setProperty('--'+k,FS[k]/100));document.body.classList.toggle('light',FS.theme=='light');
render();window.__ok=1;
</script>
</body>
</html>
